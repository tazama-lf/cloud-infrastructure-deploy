# SPDX-License-Identifier: Apache-2.0
#
# Tazama Secrets Template - DO NOT COMMIT THIS FILE
#
# This is a template for creating Tazama secrets.
# Follow these steps:
#
# 1. Copy this file:
#    cp tazama-secrets-template.yaml tazama-secrets-TEMP.yaml
#
# 2. Edit tazama-secrets-TEMP.yaml and replace all CHANGE_ME values
#
# 3. Create the sealed secret:
#    kubectl create secret generic tazama-secrets \
#      --from-literal=POSTGRES_USER=tazama \
#      --from-literal=POSTGRES_PASSWORD=YOUR_SECURE_PASSWORD \
#      --from-literal=CONFIGURATION_DB_USER=tazama \
#      --from-literal=CONFIGURATION_DB_PASSWORD=YOUR_SECURE_PASSWORD \
#      --from-literal=TRANSACTION_HISTORY_DB_USER=tazama \
#      --from-literal=TRANSACTION_HISTORY_DB_PASSWORD=YOUR_SECURE_PASSWORD \
#      --from-literal=PSEUDONYMS_DB_USER=tazama \
#      --from-literal=PSEUDONYMS_DB_PASSWORD=YOUR_SECURE_PASSWORD \
#      --from-literal=EVALUATIONS_DB_USER=tazama \
#      --from-literal=EVALUATIONS_DB_PASSWORD=YOUR_SECURE_PASSWORD \
#      --from-literal=NATS_USER=tazama \
#      --from-literal=NATS_PASSWORD=YOUR_SECURE_PASSWORD \
#      --from-literal=REDIS_PASSWORD=YOUR_SECURE_PASSWORD \
#      --from-literal=ELASTIC_PASSWORD=YOUR_SECURE_PASSWORD \
#      --namespace=staging \
#      --dry-run=client -o yaml | \
#    kubeseal --format=yaml \
#      --controller-namespace=kube-system \
#      --controller-name=sealed-secrets-controller \
#      > sealed-tazama-secrets.yaml
#
# 4. Commit the sealed secret:
#    git add sealed-tazama-secrets.yaml
#    git commit -m "Add sealed Tazama secrets"
#
# 5. Delete the temp file:
#    rm tazama-secrets-TEMP.yaml
#
# NEVER COMMIT FILES CONTAINING PLAINTEXT PASSWORDS!
---
apiVersion: v1
kind: Secret
metadata:
  name: tazama-secrets
  namespace: staging
type: Opaque
stringData:
  # PostgreSQL Master Credentials
  POSTGRES_USER: "tazama"
  POSTGRES_PASSWORD: "CHANGE_ME_SECURE_PASSWORD"

  # Configuration Database Credentials
  CONFIGURATION_DB_USER: "tazama"
  CONFIGURATION_DB_PASSWORD: "CHANGE_ME_SECURE_PASSWORD"

  # Transaction History Database Credentials
  TRANSACTION_HISTORY_DB_USER: "tazama"
  TRANSACTION_HISTORY_DB_PASSWORD: "CHANGE_ME_SECURE_PASSWORD"

  # Pseudonyms Database Credentials
  PSEUDONYMS_DB_USER: "tazama"
  PSEUDONYMS_DB_PASSWORD: "CHANGE_ME_SECURE_PASSWORD"

  # Evaluations Database Credentials
  EVALUATIONS_DB_USER: "tazama"
  EVALUATIONS_DB_PASSWORD: "CHANGE_ME_SECURE_PASSWORD"

  # NATS Credentials (if authentication enabled)
  NATS_USER: "tazama"
  NATS_PASSWORD: "CHANGE_ME_SECURE_PASSWORD"

  # Redis Password (if Redis is used)
  REDIS_PASSWORD: "CHANGE_ME_SECURE_PASSWORD"

  # Elasticsearch Password (if authentication enabled)
  ELASTIC_USER: "elastic"
  ELASTIC_PASSWORD: "CHANGE_ME_SECURE_PASSWORD"

  # API Keys (if needed)
  # APM_SECRET_TOKEN: "CHANGE_ME_APM_TOKEN"
  # JWT_SECRET: "CHANGE_ME_JWT_SECRET"
