# SPDX-License-Identifier: Apache-2.0
#
# Example Sealed Secret for Tazama
#
# This is an EXAMPLE showing the structure of a Sealed Secret.
# DO NOT use these values in production!
#
# To create your own sealed secret:
# 1. Create a regular Kubernetes secret (DON'T commit it!)
# 2. Use kubeseal to encrypt it
# 3. Commit the sealed secret to Git (safe!)
#
# See README.md in this directory for detailed instructions.

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tazama-db-credentials
  namespace: staging
spec:
  encryptedData:
    # These are example encrypted values - they won't decrypt to anything useful
    # Replace with your actual sealed values
    POSTGRES_USER: AgBxN9Z...  # Example encrypted data
    POSTGRES_PASSWORD: AgCY8...  # Example encrypted data
  template:
    metadata:
      name: tazama-db-credentials
      namespace: staging
    type: Opaque
