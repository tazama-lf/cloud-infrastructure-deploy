# SPDX-License-Identifier: Apache-2.0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-service-integration-nats
  labels:
    app: relay-service-integration-nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay-service-integration-nats
  template:
    metadata:
      name: relay-service-integration-nats
      labels:
        app: relay-service-integration-nats
    spec:
      containers:
        - name: relay-service-integration-nats
          image: tazamaorg/relay-service-integration-nats:3.0.0
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources: {}
          env:
            - name: ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          imagePullPolicy: IfNotPresent
        # - name: rule-000-sidecar-rel-1-0-0
        #   image: example.io/sidecar-rel-1-0-0:1.0.0
        #   ports:
        #     - name: http
        #       protocol: TCP
        #       containerPort: 5000
        #   resources: {}
        #   imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
      enableServiceLinks: false
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
