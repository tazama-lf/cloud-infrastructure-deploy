# SPDX-License-Identifier: Apache-2.0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumberjack
  labels:
    app: lumberjack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lumberjack
  template:
    metadata:
      name: lumberjack
      labels:
        app: lumberjack
    spec:
      volumes:
        - name: elasticsearch-master-certs
          secret:
            secretName: elasticsearch-master-certs
            defaultMode: 420
      containers:
        - name: lumberjack
          image: tazamaorg/lumberjack:3.0.0
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources: {}
          volumeMounts:
            - name: elasticsearch-master-certs
              mountPath: /usr/share/lumberjack/config/certs
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          env:
            - name: ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: NODE_EXTRA_CA_CERTS
              value: /usr/share/lumberjack/config/certs/ca.crt
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          imagePullPolicy: IfNotPresent
        # - name: rule-000-sidecar-rel-1-0-0
        #   image: example.io/sidecar-rel-1-0-0:1.0.0
        #   ports:
        #     - name: http
        #       protocol: TCP
        #       containerPort: 5000
        #   resources: {}
        #   imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
      enableServiceLinks: false
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
