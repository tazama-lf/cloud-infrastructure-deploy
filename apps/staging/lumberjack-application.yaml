apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lumberjack-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/tazama-lf/cloud-infrastructure-deploy'
    targetRevision: main
    path: k8s/overlays/staging/lumberjack
    # Since kustomize is inferred by path ending in kustomization, no explicit kustomize block needed
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
